# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rtx-v4"
BBFILE_PATTERN_rtx-v4 = "^${LAYERDIR}/"
BBFILE_PRIORITY_rtx-v4 = "6"
LAYERSERIES_COMPAT_rtx-v4 = "dunfell"

LAYERDEPENDS_rtx-v4 = "core yocto openembedded-layer meta-python"
