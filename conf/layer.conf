# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rtx"
BBFILE_PATTERN_meta-rtx = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rtx = "6"

LAYERDEPENDS_meta-rtx = "core yocto openembedded-layer meta-python"
LAYERSERIES_COMPAT_meta-rtx = "scarthgap"
